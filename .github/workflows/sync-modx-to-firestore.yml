# Incremental MODX → Firestore sync (scripts/sync-modx-to-firestore.mjs).
#
# Required repository secrets:
#   MODXDB_HOST, MODXDB_PORT, MODXDB_USER, MODXDB_DATABASE, MODXDB_PASSWORD
#   FIREBASE_ADMIN_KEY  — Firebase service account JSON (single line)
#   FIREBASE_STORAGE_BUCKET
#   CPANEL_URL          — cPanel HTTPS API base, e.g. https://example.com:2083
#   CPANEL_USER         — cPanel account username (API token owner)
#   CPANEL_TOKEN        — cPanel API token (e.g. GitHubActions)
#
# Optional secrets:
#   NETLIFY_SITE_ID, NETLIFY_ACCESS_TOKEN  (edge-cache purge after changes)
#
# Triggers:
#   - workflow_dispatch: manual full or incremental backfill (uses MySQL + cPanel)
#   - repository_dispatch (modx-doc-save): fired by MODX plugin on article save
#     (MySQL-free; payload carries rows + TVs + author chunks as gzip+base64)
#     PAT (magazin_github_token) requires Contents: write + Actions: read/write.

name: Sync MODX to Firestore

on:
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Run full backfill (--full) instead of incremental sync'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      modx_doc_id:
        description: 'MODX site_content id from save trigger (force-reprocess that doc, or removal check when unpublished)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [modx-doc-save]

# All runs serialised within their group — never cancel. Each save gets its own
# run; rapid saves queue up and are processed in order.
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'modx-firestore-sync-save' || 'modx-firestore-sync' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Allow → sync → revoke must stay in this single job so revoke can read
  # steps.cpanel_mysql.outputs.ip (step outputs are not visible across jobs).
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── workflow_dispatch (manual) path ─────────────────────────────────────
      - name: Allow GitHub Actions runner IP in cPanel Remote MySQL
        id: cpanel_mysql
        if: github.event_name == 'workflow_dispatch'
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -4 -fsS https://api.ipify.org)"
          echo "ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          bash scripts/cpanel-remote-mysql-ip.sh add "${RUNNER_IP}"

      - name: Wait for Remote MySQL ACL propagation
        if: github.event_name == 'workflow_dispatch'
        run: sleep 5

      # ── Sync step (both paths) ───────────────────────────────────────────────
      - name: Run MODX → Firestore sync
        id: sync
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            npm run sync:modx:payload
          elif [ "${{ github.event.inputs.full_backfill }}" = "true" ]; then
            npm run sync:modx:full
          else
            npm run sync:modx
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Payload path: carry the gzip+base64 doc data from the dispatch event
          MODX_SYNC_PAYLOAD: ${{ github.event.client_payload.data }}
          # MySQL path (workflow_dispatch only — harmless if empty on payload path)
          MODX_FORCE_DOC_ID: ${{ github.event.inputs.modx_doc_id }}
          MODXDB_HOST: ${{ secrets.MODXDB_HOST }}
          MODXDB_PORT: ${{ secrets.MODXDB_PORT }}
          MODXDB_USER: ${{ secrets.MODXDB_USER }}
          MODXDB_DATABASE: ${{ secrets.MODXDB_DATABASE }}
          MODXDB_PASSWORD: ${{ secrets.MODXDB_PASSWORD }}
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}

      - name: Commit sync data updates (redirects, recipes, category review)
        if: success() && steps.sync.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="src/lib/data/receptsarok-redirects.json src/lib/data/recipes.json scripts/data/magazin-recipe-category-review.json"
          MSG="chore(sync): MODX sync — receptsarok redirects, recipes and/or category review"

          CHANGED=0
          for f in $FILES; do
            if ! git diff --quiet -- "$f"; then git add "$f"; CHANGED=1; fi
          done
          if [ "$CHANGED" -eq 0 ]; then
            echo "No redirect manifest, recipes.json or category-review changes"
            exit 0
          fi
          git commit -m "$MSG"

          # Concurrent modx-doc-save runs both append to these data files, so the
          # loser's plain `git push` is rejected (non-fast-forward) and its new recipe
          # is lost from git. On rejection, re-merge our changes with the advanced
          # remote BY KEY (union — not a git text merge, which conflicts on appended
          # JSON lines) and retry, so both runs' additions survive.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed data updates (attempt $attempt)"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — re-merging with remote main…"
            git fetch origin main
            node scripts/merge-sync-data-files.mjs FETCH_HEAD
            git reset --mixed FETCH_HEAD
            for f in $FILES; do
              if ! git diff --quiet -- "$f"; then git add "$f"; fi
            done
            if git diff --cached --quiet; then
              echo "nothing left to commit after merge (remote already has our changes)"
              exit 0
            fi
            git commit -m "$MSG"
          done
          echo "ERROR: could not push data updates after 5 attempts" >&2
          exit 1

      - name: Revoke GitHub Actions runner IP from cPanel Remote MySQL
        if: always() && github.event_name == 'workflow_dispatch' && steps.cpanel_mysql.outcome == 'success'
        continue-on-error: true
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: bash scripts/cpanel-remote-mysql-ip.sh remove "${{ steps.cpanel_mysql.outputs.ip }}"
