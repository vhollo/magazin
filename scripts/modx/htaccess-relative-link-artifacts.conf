# ---------------------------------------------------------------------------
# diabetes.hu (MODX) — reject relative-link crawler paths with 410 Gone
#
# Paste this block into the live site's .htaccess AFTER `RewriteEngine On`
# (and after any RewriteBase line), and BEFORE the MODX friendly-URL rules
# (the `RewriteCond %{REQUEST_FILENAME} !-f` / `!-d` + `RewriteRule ... index.php?q=$1`
# block). Rules are evaluated in file order, so placed later it has no effect.
#
# Why: the MODX templates write internal links without the leading slash
# (`href="cikkek/diabetes/2604/…"`) and rely on `<base href="/">`. A crawler that
# ignores <base> appends each link to the current folder and keeps appending on
# every MODX 404 page (`/cikkek/diabetes/1004/cikkek/diabetes/2604/clicks/hirek/…`).
# In the access log of 2026-10-31..11-23 these were ~325k of ~493k page requests
# (≈424k per 30 days), each one a full MODX 404 render that also loads the
# Simple Analytics script and the testdiabeteshu.netlify.app load-test iframe.
#
# Rule (same as isRelativeLinkArtifact in the Magazin repo,
# src/lib/magazine/relativeLinkArtifact.ts — keep the two in sync):
# a live root section appears below the root. Two real MODX nestings are allowed:
#   - junior/{ev}/cikkek/…  and  rendezveny/{esemeny}/cikkek/…
#     (unless followed by diabetes|hypertonia, which only exist under the root cikkek)
#   - a `receptsarok` recipe group folder as the 4th segment
#     (cikkek/{mag}/{lapszam}/receptsarok, junior/{ev}/cikkek/receptsarok),
#     unless followed by an old root recipe category (levesek, haletelek, …)
#
# 410 instead of 404: crawlers drop 410 URLs faster. The ErrorDocument below makes
# Apache answer with a short text body itself, so MODX (index.php) is not started.
# Existing files are never touched (the -f check).
# ---------------------------------------------------------------------------

ErrorDocument 410 "410 Gone"

RewriteCond %{REQUEST_FILENAME} !-f
# 1. any live root section except cikkek and receptsarok, anywhere below the root
RewriteCond %{REQUEST_URI} ^/[^/]+/(?:[^/]+/)*(?:hirek|alapitvany|junior|rendezveny|diaeuro-futsal|oktatas|findrisk|clicks|patika|kiadvanyok|adatkezelesi-tajekoztato)(?:/|$) [OR]
# 2. cikkek as the 2nd segment, or as the 4th or deeper
RewriteCond %{REQUEST_URI} ^/[^/]+/(?:[^/]+/[^/]+/(?:[^/]+/)*)?cikkek(?:/|$) [OR]
# 3. cikkek as the 3rd segment: only junior/{ev}/cikkek and rendezveny/{x}/cikkek are real …
RewriteCond %{REQUEST_URI} ^/(?!(?:junior|rendezveny)/)[^/]+/[^/]+/cikkek(?:/|$) [OR]
# … and even there, not when followed by diabetes|hypertonia
RewriteCond %{REQUEST_URI} ^/(?:junior|rendezveny)/[^/]+/cikkek/(?:diabetes|hypertonia)(?:/|$) [OR]
# 4. receptsarok as the 2nd/3rd segment, or as the 5th or deeper
RewriteCond %{REQUEST_URI} ^/[^/]+/(?:[^/]+/)?receptsarok(?:/|$) [OR]
RewriteCond %{REQUEST_URI} ^/(?:[^/]+/){4,}receptsarok(?:/|$) [OR]
# 5. receptsarok as the 4th segment followed by an old root recipe category
RewriteCond %{REQUEST_URI} ^/(?:[^/]+/){3}receptsarok/(?:levesek|zoldsegetelek|haletelek|husetelek|egytaletelek|koretek-italok-hidegkonyha|desszertek)(?:/|$)
RewriteRule ^ - [G,L]
